[project]
name = "vivido"
version = "0.1.0"
description = "Fast Telegram media embedder bot with Celery and Redis"
authors = [
    { name = "Vlad_Montana", email = "[EMAIL_ADDRESS]" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.4.1",
    "celery>=5.6.3",
    "loguru>=0.7.3",
    "pydantic-settings>=2.15.0",
    "redis>=8.1.0",
    "requests>=2.34.2",
    "yt-dlp>=2024.3.10",
]

[project.scripts]
vivido = "vivido:main"


[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.4",
    "ty>=0.0.73",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "C4",    # flake8-comprehensions
]
ignore = [
    "E501",  # line too long
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

