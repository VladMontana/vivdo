services:
  redis:
    image: redis:7-alpine
    container_name: vivido_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - vivido

  bot:
    build: .
    container_name: vivido_app
    restart: unless-stopped
    command: uv run vivido
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vivido

  worker:
    build: .
    container_name: vivido_worker
    restart: unless-stopped
    command: uv run celery -A vivido.celery_worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - vivido

volumes:
  redis_data:

networks:
  vivido:
    driver: bridge
