services:
  redis:
    image: redis:7-alpine
    container_name: vivido_redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"

  bot:
    build: .
    container_name: vivido_app
    restart: unless-stopped
    command: uv run vivido
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  worker:
    build: .
    container_name: vivido_worker
    restart: unless-stopped
    command: uv run celery -A vivido.celery_worker.celery_app worker --loglevel=info --concurrency=4
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

